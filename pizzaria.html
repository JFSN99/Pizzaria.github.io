<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./pizzaria.css">
    <title>Pizzaria</title>
</head>
<body>
    <div class="buying-container">
        <div class="buying">
            <img src="" class="form-img" alt="">
            <form class="selec" action="POST">
                <div class="flavor">----</div>
                <div class="preco">----</div>
                <label for="Quantidade">Quantidade</label>
                <input type="number" name="" id="Quantidade" min="1" value="1">
                <div class="pesos-cont">
                    <button>Pequena 100g</button>
                    <button>Média 500g</button>
                    <button>Grande 800g</button>
                </div>
                <input type="submit" class="add-cart" value="Adicionar ao Carrinho">
                <button class="cancel">Cancelar</button>
                
            </form>
        </div>
    </div>
    <header><div>Pizza do Lolo</div><button class="showKart"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTyVBQBnn2VAnKFYK0tJTDBD6ssmovzAD0R3Ioan20PzA&s=10" alt=""></button></header>
    <div class="corpo">
        <div class="fake-tela">
            <div class="container">
        
                <div data-sabor="0" class="price-area">
                    <img class="product" src="" alt="">
                    <div class="add">+</div>
                    <div class="desc"></div>
                    <div class="price"></div>
                </div>
                <div data-sabor="1" class="price-area">
                    <img class="product" src="" alt="">
                    <div class="add">+</div>
                    <div class="desc"></div>
                    <div class="price"></div>
                </div>
                <div data-sabor="2" class="price-area">
                    <img class="product" src="" alt="">
                    <div class="add">+</div>
                    <div class="desc"></div>
                    <div class="price"></div>
                </div>
                <div data-sabor="3" class="price-area">
                    <img class="product" src="" alt="">
                    <div class="add">+</div>
                    <div class="desc"></div>
                    <div class="price"></div>
                </div>
                <div data-sabor="4" class="price-area">
                    <img class="product" src="" alt="">
                    <div class="add">+</div>
                    <div class="desc"></div>
                    <div class="price"></div>
                </div>
                <div data-sabor="5" class="price-area">
                    <img class="product" src="" alt="">
                    <div class="add">+</div>
                    <div class="desc"></div>
                    <div class="price"></div>
                </div>
                <div data-sabor="6" class="price-area">
                    <img class="product" src="" alt="">
                    <div class="add">+</div>
                    <div class="desc"></div>
                    <div class="price"></div>
                </div>
                <div data-sabor="7" class="price-area">
                    <img class="product" src="" alt="">
                    <div class="add">+</div>
                    <div class="desc"></div>
                    <div class="price"></div>
                </div>
            </div>
        </div>
        
        <div class="kart">
            
            <h1>Seu pedido</h1>
            
            <div class="Pedido-cont">
                <ul class="lista">

                </ul>
            </div>
            <div class="cont-sub">
                <div class="">Subtotal</div>
                <ul class="gastos">
                
                </ul>
            </div>
            <div class="cont desconto">
                <div class="">Desconto (-10%)</div>
                <div class="Tirou">---</div>
            </div>
            <div class="cont">
                <div class="">Total</div>
                <div class="total">---</div>
            </div>

            <button class="finish">
                Finalizar compras
            </button>
        </div>
    </div>
   
    
    <script src="sabores.js"></script>
    <script src="./pizzaria.js"></script>
